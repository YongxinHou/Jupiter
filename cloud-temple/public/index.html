<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>云寺 · Cloud Temple</title>
  <meta name="description" content="一座在线的小寺。不说话，只合十、礼拜、转念珠。">
  <meta name="theme-color" content="#1d1a17">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Serif+SC:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Entrance -->
  <section id="gate">
    <div class="gate-inner">
      <h1>云寺</h1>
      <p class="sub">一座不说话的小寺</p>
      <p class="desc">这里没有聊天。<br>你只需要走进去，合十，礼拜，转一转念珠。</p>
      <button id="enter">入 寺</button>
      <p class="gate-brand">艾香 · <span class="brand">wanche</span></p>
      <p class="hint">建议戴上耳机 · 点击地面行走 · 点转经筒去转经 · 键盘 WASD / 数字 1–7</p>
    </div>
  </section>

  <!-- Temple -->
  <main id="temple" hidden>
    <canvas id="scene"></canvas>

    <header class="hud">
      <div class="me"><span class="dot" id="myRobe"></span><span id="myName">…</span></div>
      <div class="online"><span id="here">1</span> 人在此堂 · 共 <span id="online">1</span> 人</div>
    </header>

    <div class="merit">
      <div><b id="myBows">0</b><small>今日礼拜</small></div>
      <button id="malaBtn" title="更换念珠"><b id="myBeads">0</b><small>念珠 · 换串</small></button>
      <div><b id="allBows">0</b><small>寺中总礼拜</small></div>
    </div>

    <nav class="actions">
      <button data-act="palm" title="合十 (1)"><i>🙏</i><span>合十</span></button>
      <button data-act="bow" title="礼拜 (2)"><i>🧎</i><span>礼拜</span></button>
      <button data-act="prostrate" title="长磕头 (3)"><i>🙇</i><span>长磕头</span></button>
      <button data-act="beads" title="念珠 (4)"><i>📿</i><span>念珠</span></button>
      <button data-act="incense" title="点香 (5)"><i>🪔</i><span>点香</span></button>
      <button data-act="wheel" title="转经筒 (6)"><i>☸️</i><span>转经</span></button>
      <button data-act="moktak" title="木鱼 (7)"><i>🪵</i><span>木鱼</span></button>
      <button id="soundBtn" class="toggle"><i>🔔</i><span>声音</span></button>
    </nav>

    <div id="toast"></div>

    <!-- picker sheet: incense colour / mala size -->
    <div id="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <header>
          <div>
            <div class="brand" id="sheetBrand">wanche</div>
            <h2 id="sheetTitle"></h2>
          </div>
          <button class="sheet-x" id="sheetX" aria-label="关闭">×</button>
        </header>
        <div class="opts" id="sheetOpts"></div>
        <p class="sheet-note" id="sheetNote"></p>
        <button class="sheet-go" id="sheetGo"></button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
